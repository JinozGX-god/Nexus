<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbd38d" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Cyber Ambient Glow -->
  <circle cx="100" cy="100" r="95" fill="#0f172a" stroke="url(#bgGrad)" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="#1e293b" />

  <!-- Background Tech Grid Lines -->
  <path d="M 40 100 H 160 M 100 40 V 160" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1" />
  <circle cx="100" cy="100" r="60" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Body / Tech Jacket -->
  <path d="M 50 190 C 50 148 72 135 100 135 C 128 135 150 148 150 190 Z" fill="url(#jacketGrad)" />
  <!-- Jacket Collar / Inner Shirt -->
  <polygon points="100,140 82,190 118,190" fill="#0f172a" />
  <polygon points="100,145 90,175 110,175" fill="#38bdf8" />

  <!-- Neck -->
  <rect x="90" y="112" width="20" height="26" rx="4" fill="url(#skinGrad)" />

  <!-- Head / Face -->
  <ellipse cx="100" cy="92" rx="34" ry="40" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M 66 84 C 66 52 82 42 100 42 C 122 42 136 54 134 84 C 128 72 118 68 100 70 C 86 71 76 76 66 84 Z" fill="url(#hairGrad)" />
  <path d="M 64 78 C 68 62 82 50 102 50 C 120 50 132 60 135 74 C 125 64 110 60 98 62 C 84 64 72 70 64 78 Z" fill="#334155" />

  <!-- Glasses (AI / Tech Vibe) -->
  <rect x="74" y="82" width="22" height="15" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="104" y="82" width="22" height="15" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="96" y1="89" x2="104" y2="89" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="68" y1="87" x2="74" y2="87" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="126" y1="87" x2="132" y2="87" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Eyes -->
  <circle cx="85" cy="89" r="3.5" fill="#0f172a" />
  <circle cx="115" cy="89" r="3.5" fill="#0f172a" />
  <circle cx="86" cy="87.5" r="1.2" fill="#ffffff" />
  <circle cx="116" cy="87.5" r="1.2" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M 75 78 Q 85 75 93 78" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 107 78 Q 115 75 125 78" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Smile -->
  <path d="M 91 112 Q 100 120 109 112" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- AI Brain / Tech Icon Hologram on shoulder -->
  <circle cx="152" cy="70" r="16" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
  <path d="M 146 70 L 152 64 L 158 70 L 152 76 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" />
  <circle cx="152" cy="70" r="2.5" fill="#06b6d4" />
</svg>
