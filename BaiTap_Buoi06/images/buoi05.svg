<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg-buoi05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="accentGlow-buoi05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow-buoi05" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg-buoi05)" rx="16" />

  <!-- Subtle Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Browser window mockup header -->
  <rect x="40" y="35" width="720" height="410" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#shadow-buoi05)" />
  
  <!-- Window top bar -->
  <rect x="40" y="35" width="720" height="42" rx="12" fill="rgba(30, 41, 59, 0.8)" />
  <circle cx="65" cy="56" r="6" fill="#ef4444" />
  <circle cx="85" cy="56" r="6" fill="#f59e0b" />
  <circle cx="105" cy="56" r="6" fill="#10b981" />
  
  <!-- URL bar -->
  <rect x="135" y="44" width="450" height="24" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)" />
  <text x="150" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">https://nexus-lhu.edu.vn/buoi05/index.html</text>

  <!-- Top badge -->
  <rect x="630" y="44" width="115" height="24" rx="12" fill="url(#accentGlow-buoi05)" />
  <text x="687" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Animation FX</text>

  <!-- Content left: Info & Title -->
  <g transform="translate(70, 110)">
    <text x="0" y="24" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">BUỔI 05 · TUẦN 5</text>
    <text x="0" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Animation &amp; Thư Viện AOS</text>
    <text x="0" y="94" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Hiệu ứng 3D Card, FAB Pulse, Preloader và Cuộn AOS</text>

    <!-- Tag badges -->
    <g transform="translate(0, 125)">
      
        <rect x="0" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" />
        <text x="42" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Keyframes</text>
      
        <rect x="95" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" />
        <text x="137" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">AOS Library</text>
      
        <rect x="190" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" />
        <text x="232" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">MicroFX</text>
      
        <rect x="285" y="0" width="85" height="26" rx="6" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" />
        <text x="327" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">PureCSS</text>
      
    </g>

    <text x="0" y="200" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Tac gia: Nguyen Hoang Phuc - MSSV: 25AI111 - DH Lac Hong</text>
  </g>

  <!-- Content right: Code block illustration -->
  <g transform="translate(480, 110)">
    <rect x="0" y="0" width="250" height="240" rx="10" fill="rgba(3, 7, 18, 0.85)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="28" rx="10" fill="rgba(15, 23, 42, 0.9)" />
    <circle cx="15" cy="14" r="4" fill="#64748b" />
    <circle cx="28" cy="14" r="4" fill="#64748b" />
    <circle cx="41" cy="14" r="4" fill="#64748b" />
    <text x="60" y="18" fill="#94a3b8" font-family="monospace" font-size="10">buoi05.code</text>

    <text x="16" y="55" fill="#c084fc" font-family="monospace" font-size="11" font-weight="600">/* Source Snippet */</text>
    
      <text x="16" y="78" fill="#94a3b8" font-family="monospace" font-size="10.5">@keyframes pulseGlow {</text>
    
      <text x="16" y="100" fill="#94a3b8" font-family="monospace" font-size="10.5">  0% { transform: scale(1); }</text>
    
      <text x="16" y="122" fill="#94a3b8" font-family="monospace" font-size="10.5">  50% { transform: scale(1.08); }</text>
    
      <text x="16" y="144" fill="#94a3b8" font-family="monospace" font-size="10.5">  100% { transform: scale(1); }</text>
    
      <text x="16" y="166" fill="#94a3b8" font-family="monospace" font-size="10.5">}</text>
    
      <text x="16" y="188" fill="#94a3b8" font-family="monospace" font-size="10.5">[data-aos=&quot;fade-up&quot;] { opacity: 1; }</text>
    
  </g>

  <!-- Live preview button indicator -->
  <g transform="translate(70, 375)">
    <rect x="0" y="0" width="130" height="34" rx="8" fill="url(#accentGlow-buoi05)" />
    <text x="65" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">XEM BAI TAP &gt;</text>
  </g>
</svg>