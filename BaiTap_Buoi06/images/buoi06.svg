    <text x="0" y="200" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Tác giả: Nguyễn Hoàng Phúc · MSSV: 25AI111 · ĐH Lạc Hồng</text>
