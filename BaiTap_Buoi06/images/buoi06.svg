  <!-- Content right: Code block illustration -->
  <g transform="translate(480, 110)">
    <rect x="0" y="0" width="250" height="240" rx="10" fill="rgba(3, 7, 18, 0.85)" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="1.5" />
