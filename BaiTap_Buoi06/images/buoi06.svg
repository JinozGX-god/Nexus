      <text x="16" y="166" fill="#94a3b8" font-family="monospace" font-size="10.5">  &lt;!-- 3 Cols Flexbox --&gt;</text>
    
      <text x="16" y="188" fill="#94a3b8" font-family="monospace" font-size="10.5">&lt;/footer&gt;</text>
    
