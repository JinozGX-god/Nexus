    <text x="60" y="18" fill="#94a3b8" font-family="monospace" font-size="10">buoi06.code</text>

    <text x="16" y="55" fill="#f43f5e" font-family="monospace" font-size="11" font-weight="600">/* Source Snippet */</text>
    
      <text x="16" y="78" fill="#94a3b8" font-family="monospace" font-size="10.5">&lt;div class=&quot;hub-grid&quot;&gt;</text>
    
