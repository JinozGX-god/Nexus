    <rect x="0" y="0" width="130" height="34" rx="8" fill="url(#accentGlow-buoi06)" />
    <text x="65" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">XEM BÀI TẬP &#8594;</text>
