<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <defs>
    <!-- Gradient nền Neon Cyber -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Gradient vòng phát sáng -->
    <linearGradient id="ringGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Gradient nhân vật -->
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Bộ lọc phát sáng Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Vòng tròn nền chính -->
  <circle cx="75" cy="75" r="70" fill="#0b1120" stroke="url(#ringGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Vành đai công nghệ AI dạng đứt nét -->
  <circle cx="75" cy="75" r="63" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Nền gradient mềm phía sau nhân vật -->
  <circle cx="75" cy="75" r="56" fill="url(#bgGrad)" opacity="0.35"/>

  <!-- Phần thân/vai nhân vật -->
  <path d="M38 128 C38 100, 52 92, 75 92 C98 92, 112 100, 112 128 Z" fill="url(#avatarGrad)" opacity="0.95"/>

  <!-- Áo khoác công nghệ cổ đứng -->
  <path d="M62 94 L75 110 L88 94 Z" fill="#6366f1" opacity="0.8"/>

  <!-- Đầu nhân vật -->
  <circle cx="75" cy="62" r="23" fill="url(#avatarGrad)"/>

  <!-- Tóc hiện đại anime/developer phong cách trẻ trung -->
  <path d="M52 60 C50 42, 64 36, 75 36 C88 36, 100 42, 98 60 C94 50, 86 46, 75 48 C64 46, 56 50, 52 60 Z" fill="#1e293b"/>
  <path d="M52 60 C53 66, 56 70, 58 72 C56 68, 55 64, 55 60 Z" fill="#1e293b"/>
  <path d="M98 60 C97 66, 94 70, 92 72 C94 68, 95 64, 95 60 Z" fill="#1e293b"/>

  <!-- Kính công nghệ phát sáng HUD AI -->
  <rect x="58" y="56" width="34" height="10" rx="4" fill="#06b6d4" opacity="0.9" filter="url(#glow)"/>
  <line x1="60" y1="61" x2="90" y2="61" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

  <!-- Điểm nhấn nơ-ron AI / công nghệ -->
  <circle cx="42" cy="45" r="2" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="108" cy="45" r="2" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="75" cy="22" r="2.5" fill="#a855f7" filter="url(#glow)"/>
</svg>
